# Alembic configuration for PrivacyMon's platform database.
# The database URL is NOT stored here — env.py reads PRIVACYMON_DB_URL so secrets
# never land in a committed file (SRS 11.2). The default below is a non-secret local
# dev value, also used for `alembic upgrade head --sql` offline SQL generation.
[alembic]
script_location = platform_db/migrations
prepend_sys_path = .
path_separator = os
sqlalchemy.url = postgresql+psycopg://privacymon:privacymon@localhost:5432/privacymon

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
