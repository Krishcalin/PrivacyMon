[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "privacymon"
version = "0.1.0"
description = "PrivacyMon — DPIA platform that discovers Indian personal data and maps it to the DPDP Act 2023"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Krishnendu De" }]

dependencies = [
    "fastapi>=0.110",
    "pydantic>=2.6",
]

[project.optional-dependencies]
# API/worker runtime beyond the dependency-free core (installed per tier).
server = [
    "uvicorn[standard]>=0.29",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "celery>=5.3",
    "redis>=5.0",
    "python-multipart>=0.0.9",
    "structlog>=24.1",
    "jinja2>=3.1",
    "prometheus-client>=0.20",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "httpx>=0.27",
    "mypy>=1.8",
    "ruff>=0.4",
]

[tool.setuptools]
packages = ["dpia_core", "dpia_core.detectors", "api", "api.app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
